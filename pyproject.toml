[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rtx"
dynamic = ["version"]
description = "Low-precision training and inference kernels for NVIDIA RTX Blackwell"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  {name = "Achiya Deri @LATENT ADVANTAGE LTD", email = "achiya.work@gmail.com"},
]
dependencies = [
  "numpy>=2.0,<3",
  "torch>=2.9",
  "torchao>=0.18.0",
  "cuda-python>=13.0,<14",
  "nvidia-cutlass-dsl[cu13]>=4.7,<4.8",
  "pyarrow>=16",
  "apache-tvm-ffi==0.1.13.post2",
  "einops",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/achiya-deri-work/rtx"
Issues = "https://github.com/achiya-deri-work/rtx/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2", "twine>=5"]

[project.scripts]
rtx-autotune = "rtx.autotune.dataset:main"
rtx-autotune-legacy = "rtx.autotune.legacy:_cli"
rtx-prequant-experiment = "rtx.prequant_experiments:_cli"

[tool.setuptools.dynamic]
version = {attr = "rtx._version.__version__"}

[tool.setuptools.packages.find]
include = ["rtx", "rtx.*"]

[tool.setuptools.package-data]
rtx = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
