name: ci

on:
  push:
  pull_request:

jobs:
  package-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU contract-test dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --no-deps -e .
      - name: Verify architecture-neutral public contracts
        run: python -m unittest tests.test_linear_frontends -v
      - name: Build distributions
        run: python -m build
      - name: Check wheel identity and contents
        run: |
          python -m zipfile -l dist/rtx-*.whl
          test -f dist/rtx-*.tar.gz
