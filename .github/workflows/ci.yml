name: ci

on:
  push:
  pull_request:

jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU contract-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'numpy>=2,<3' 'torchao>=0.18' 'pyarrow>=16'
          python -m pip install --no-deps -e .
      - name: Compile Python sources
        run: python -m compileall -q rtx tests
      - name: Run the complete CPU-safe suite
        run: python -m unittest discover -s tests -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Build distributions
        run: python -m pip install --upgrade pip build twine && python -m build
      - name: Check metadata, wheel identity, and contents
        run: |
          python -m twine check dist/*
          python -m zipfile -l dist/rtx-*.whl
          test -f dist/rtx-*.tar.gz
