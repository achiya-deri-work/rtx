name: sm120-gpu-smoke

on:
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run every CUDA-gated test instead of frontend/kernel smoke tests
        required: false
        default: false
        type: boolean
      backward_benchmark:
        description: Run the fused-versus-decomposed backward benchmark
        required: false
        default: false
        type: boolean
      production_matrix:
        description: Run the unified frontend production matrix in quick mode
        required: false
        default: false
        type: boolean

jobs:
  sm120:
    # Install a self-hosted runner with these labels on an RTX Blackwell box.
    runs-on: [self-hosted, linux, x64, sm120]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify the pre-provisioned CUDA environment
        run: |
          python -c "import torch; assert torch.cuda.is_available(); assert torch.cuda.get_device_capability()[0] == 12"
          python -c "import torchao, pyarrow, cutlass"
      - name: Install this checkout without replacing CUDA dependencies
        run: python -m pip install --no-deps -e .
      - name: Validate the exact native runtime contract
        run: python -c "import rtx; print(rtx.validate_runtime_environment())"
      - name: Run SM120 smoke tests
        if: ${{ !inputs.full_suite }}
        run: |
          python -m unittest tests.test_linear_frontends -v
          python -m unittest tests.test_mxfp8_quant tests.test_mxfp8_fwd tests.test_mxfp8_bwd tests.test_nvfp4 -v
      - name: Run every CUDA-gated test
        if: ${{ inputs.full_suite }}
        run: python -m unittest discover -s tests -v
      - name: Benchmark backward kernel families
        if: ${{ inputs.backward_benchmark }}
        run: |
          python benchmarks/benchmark_mxfp8_bwd.py \
            --m 512 --n 1536 --k 1536 \
            --output autotune_reports/ci_mxfp8_backward.json
      - name: Run unified production matrix
        if: ${{ inputs.production_matrix }}
        run: |
          python benchmarks/validate_production.py --quick \
            --output autotune_reports/ci_production_matrix.json
      - name: Upload backward benchmark
        if: ${{ inputs.backward_benchmark && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mxfp8-backward-${{ runner.name }}
          path: autotune_reports/ci_mxfp8_backward.json
      - name: Upload production matrix
        if: ${{ inputs.production_matrix && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: production-matrix-${{ runner.name }}
          path: autotune_reports/ci_production_matrix.json
